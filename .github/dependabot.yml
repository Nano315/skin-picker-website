version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-et-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Aucune majeure proposee automatiquement. Sur les repos de l'app, le
      # premier lot a ouvert des PR soit impossibles a merger (peer deps
      # verrouillees), soit vertes mais dangereuses — tailwindcss 3->4 passe les
      # tests alors que c'est une reecriture complete, faute de test visuel.
      # Une majeure se decide et se teste a la main.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
