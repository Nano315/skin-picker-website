version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-et-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Next.js majeur = migration a faire deliberement, pas dans un lot.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
